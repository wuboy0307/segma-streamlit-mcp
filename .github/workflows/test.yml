# Runs this repo's tests on every push and pull request.
#
# Until 2026-08-28 there was no CI here at all. `tests/` held two correct
# files that exit non-zero on failure, and nothing invoked either of them —
# not a pipeline, not a script, only a command a person had to type, and
# `pytest` was not even installed in the checkout's own virtualenv. That is
# the same state segma-mcp was in until 2026-08-19: a check that can fail but
# never runs is worth what a check that cannot fail is worth.
#
# This is GitHub Actions rather than `.gitlab-ci.yml` because this repo alone
# lives on GitHub; every other Segma repo is on gitlab.com/wavein. Putting a
# GitLab config here would have added a file that never executes, which is the
# failure this job exists to end.
#
# WHAT THIS JOB DOES NOT COVER, and what does instead
# ---------------------------------------------------
# `tests/test_prompt_templates_sync.py` is deliberately not run here. It
# checks the app's PROMPT_TEMPLATES against `segma-mcp/prompts/templates.yaml`
# — a sibling repository, private, and on a different host — so a job that
# checks out this repo alone cannot see the file it needs. Running it anyway
# would produce a skip or an error dressed up as a pass.
#
# So the cross-repo half is not gated by CI. What stands in for it:
# `tools/extract_prompt_templates.py` verifies the round trip string for
# string every time it regenerates the YAML, which is the moment the two
# copies are actually written, and both repos' changes ship in one review.
# Closing the gap properly needs a GitLab token in this repo's secrets so the
# job can fetch that file; that is a credential decision, not a technical one,
# and it has not been taken.
#
# The half that IS gated here is the one that was silently drifting: PROMPTS.md
# against the app. It had 11 templates missing and 5 left at older wording
# before anything checked it.

name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # First, and before any install, because it needs nothing: --check-doc
      # returns before the script imports PyYAML or looks at the sibling repo.
      # A gate with no dependencies is a gate that cannot fail for a reason
      # that has nothing to do with the code.
      - name: PROMPTS.md still says what the app says
        run: python tools/extract_prompt_templates.py --check-doc

      # requirements.txt is generated from requirements.in, so it can silently
      # stop describing it — someone edits the .in, forgets to recompile, and
      # the lock keeps installing the old tree while the diff looks correct.
      # Recompiling into a scratch directory and diffing is what turns that
      # into a red build. The scratch copy keeps the same relative filenames on
      # purpose: uv writes the command line into the header, so compiling to a
      # different path would differ in the header alone and fail every run.
      # uv itself is pinned, and that is not tidiness. This step compares the
      # OUTPUT of a generator, so the generator's version is an input to the
      # comparison: a newer uv that reorders a line or reworks the header would
      # fail this check on a repository nobody had touched.
      #
      # The version is READ from requirements.in rather than written here.
      # Naming it in both places would need whoever bumps it to remember the
      # other one at the moment of typing, which is the kind of rule that fails
      # exactly when someone is busy. One number, one file.
      - name: Install uv (version comes from requirements.in — one source)
        run: |
          ver=$(sed -n 's/^# uv-version: *//p' requirements.in | head -1)
          [ -n "$ver" ] || { echo "::error::requirements.in has no '# uv-version:' line"; exit 1; }
          pip install "uv==$ver"

      # BOTH files are copied in, and the lock is the load-bearing half.
      # `uv pip compile` treats an existing output file as pinned preferences
      # (only `-U` ignores them), so compiling from the .in alone re-resolves
      # all 42 transitive packages against live PyPI. That check would answer
      # "has PyPI moved since this morning" — red on a commit that changed
      # nothing, the first day any dependency ships a release — instead of
      # "does the lock still describe the .in". Copying the lock in reproduces
      # exactly what a developer runs in the repo, which is also what makes the
      # remedy printed below actually work for them.
      #
      # rm -rf first: on a reused runner a leftover file here would silently
      # become the preference set, so the same commit could pass or fail
      # depending on what ran before it.
      - name: requirements.txt still matches requirements.in
        run: |
          rm -rf /tmp/lockcheck && mkdir -p /tmp/lockcheck
          cp requirements.in requirements.txt /tmp/lockcheck/
          (cd /tmp/lockcheck && uv pip compile --universal --python-version 3.11 \
             --output-file requirements.txt requirements.in)
          diff -u requirements.txt /tmp/lockcheck/requirements.txt \
            || { echo "::error::requirements.in changed without recompiling the lock. Run: uv pip compile --universal --python-version 3.11 --output-file requirements.txt requirements.in"; exit 1; }

      # The lock, not the .in — CI must install exactly what the container
      # installs, which is this file.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runs standalone; the file has its own __main__ and asserts plainly, so
      # pytest is not needed and is not installed.
      - name: agent_runtime unit tests
        run: python tests/test_agent_runtime.py
